name: Official Release

# Triggering
# ----------
# workflow_dispatch : the normal way to cut a release. The version is read from
#                     app/build.gradle.kts, so you control it with one commit.
#                     `dry_run: true` builds and uploads everything but creates no
#                     Release, bumps no version and posts nothing — use it to test.
# push tags v*      : pushing a tag like v0.5.220 releases that version.
#
# Deliberately NOT triggered on push to main: a release publishes a tag, five
# APKs and a Discord announcement, and that should never happen by accident when
# a PR is merged. To restore auto-release-on-merge, add:
#     push:
#       branches: [main]
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only — skip the GitHub Release, version bump and Discord post'
        type: boolean
        default: false
      notify_test:
        description: 'Also send the Discord notification (use with dry_run to test the webhook)'
        type: boolean
        default: false
      force_ai_notes:
        description: 'Ignore RELEASE_NOTES.md and always generate notes with Gemini (for testing the key)'
        type: boolean
        default: false
      gemini_check:
        description: 'Only test the GEMINI_API_KEY against the API (~30s, no build, publishes nothing)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ABIS: armeabi-v7a,arm64-v8a,x86,x86_64

jobs:
  gemini-check:
    name: Gemini API key check
    if: ${{ inputs.gemini_check }}
    runs-on: ubuntu-latest
    steps:
      - name: Call Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -uo pipefail

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::GEMINI_API_KEY secret is not set"
            exit 1
          fi

          # 1. Ask the API which models this key can actually use.
          MODELS_JSON=$(curl -sS "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}&pageSize=200" || echo '{}')
          AVAILABLE=$(echo "$MODELS_JSON" | jq -r '.models[]? | select((.supportedGenerationMethods // []) | index("generateContent")) | .name' 2>/dev/null | sed 's|^models/||' | tr '\n' ' ')
          LIST_ERROR=$(echo "$MODELS_JSON" | jq -r '.error.message // empty' 2>/dev/null)

          echo "Available generateContent models: ${AVAILABLE:-<none>}"
          if [[ -n "$LIST_ERROR" ]]; then
            echo "::warning::Listing models failed: $LIST_ERROR"
          fi
          echo "::notice::Models available to this key: ${AVAILABLE:0:900}"

          # 2. Try the usable chat-style models, newest-looking first.
          PAYLOAD=$(jq -n '{contents: [{parts: [{text: "Reply with exactly: OK"}]}], generationConfig: {temperature: 0, maxOutputTokens: 16}}')

          CANDIDATES=$(printf '%s\n' $AVAILABLE | grep -viE 'embedding|aqa|imagen|veo|tts|image|live|thinking' | head -n 6)
          if [[ -z "$CANDIDATES" ]]; then
            CANDIDATES=$(printf '%s\n' gemini-3.8-flash gemini-flash-latest gemini-2.5-flash)
          fi

          REPORT=""
          for model in $CANDIDATES; do
            HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}" \
              -H 'Content-Type: application/json' -d "$PAYLOAD")
            TEXT=$(jq -r '.candidates[0].content.parts[0].text // empty' /tmp/resp.json 2>/dev/null)

            if [[ "$HTTP" == "200" && -n "$TEXT" ]]; then
              echo "::notice::Gemini works. Use model '$model' (it replied: $TEXT)"
              exit 0
            fi

            MSG=$(jq -r '.error.message // .promptFeedback.blockReason // "no text"' /tmp/resp.json 2>/dev/null | head -c 160)
            echo "$model -> HTTP $HTTP: $MSG"
            REPORT="${REPORT}${model}=${HTTP}; "
          done

          echo "::error::No usable Gemini model. Tried: ${REPORT}Available: ${AVAILABLE:0:600}"
          exit 1

  build-release:
    name: Build & Public Release
    if: ${{ !inputs.gemini_check }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Determine version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          fi
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)

          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine versionName from app/build.gradle.kts"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Releasing Hikaru v$VERSION (versionCode $VERSION_CODE) from ${GITHUB_REF}"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Configure the GitHub secret KEYSTORE_BASE64}"
          : "${SIGNING_STORE_PASSWORD:?Configure the GitHub secret SIGNING_STORE_PASSWORD}"
          : "${SIGNING_KEY_ALIAS:?Configure the GitHub secret SIGNING_KEY_ALIAS}"
          : "${SIGNING_KEY_PASSWORD:?Configure the GitHub secret SIGNING_KEY_PASSWORD}"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/hikaru.jks
          test -s app/hikaru.jks
          keytool -list -keystore app/hikaru.jks -storepass "$SIGNING_STORE_PASSWORD" >/dev/null
          keytool -list -keystore app/hikaru.jks \
            -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null

      - name: Run Code Analysis (Detekt)
        run: ./gradlew detekt --no-daemon

      - name: Build release APKs
        run: >-
          ./gradlew assembleRelease
          -PabiList=${{ env.ABIS }}
          -Pinclude-telemetry=false
          -Penable-updater=true
          --no-daemon
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          DISCORD_RPC_APP_ID: ${{ vars.DISCORD_RPC_APP_ID }}

      - name: Rename and validate APKs
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release

          # 4 per-ABI splits + 1 universal APK
          for abi in armeabi-v7a arm64-v8a x86 x86_64 universal; do
            src="app-${abi}-release.apk"
            if [[ ! -f "$src" ]]; then
              echo "::error::Expected APK '$src' was not produced"
              ls -l
              exit 1
            fi
            out="Hikaru-v${VERSION}-${abi}-release.apk"
            mv "$src" "$out"
            if [[ ! -s "$out" ]]; then
              echo "::error::$out is empty"
              exit 1
            fi
            echo "✓ $out ($(du -h "$out" | cut -f1))"
          done

          # Nothing may be left behind: the release uploads *.apk from this folder.
          leftover=$(find . -maxdepth 1 -name '*.apk' | wc -l)
          if [[ "$leftover" -ne 5 ]]; then
            echo "::error::Expected 5 APKs, found $leftover"
            ls -l
            exit 1
          fi
          echo "All 5 release APKs renamed with version $VERSION"

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hikaru-v${{ env.VERSION }}-release-apks
          path: app/build/outputs/apk/release/Hikaru-v${{ env.VERSION }}-*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate changelog context
        run: |
          set -euo pipefail
          mkdir -p .github/ai

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$PREV_TAG" ]]; then
            RANGE="-n 15"
            echo "No previous tag found, using the last 15 commits." >&2
          else
            RANGE="$PREV_TAG..HEAD"
            echo "Changes since $PREV_TAG" >&2
          fi

          git log $RANGE --pretty=format:'- %s' \
            | grep -v 'chore(release): prepare' \
            | grep -v -E '^- Merge (pull request|branch|remote-tracking)' \
            > .github/ai/commits.txt || true
          git diff --stat $RANGE > .github/ai/files.txt || true

          if [[ ! -s .github/ai/commits.txt ]]; then
            echo "- General stability and polish" > .github/ai/commits.txt
          fi

      - name: Write release changelog
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_AI_NOTES: ${{ inputs.force_ai_notes }}
        run: |
          set -euo pipefail
          mkdir -p .github/ai

          # 0. Explicit opt-out, so the Gemini key can be tested on demand.
          if [[ "${FORCE_AI_NOTES:-false}" == "true" ]]; then
            echo "force_ai_notes=true - skipping RELEASE_NOTES.md and generating notes with Gemini"
          # 1. Hand-written notes win, as long as they are meant for this version.
          elif [[ -s RELEASE_NOTES.md ]]; then
            DECLARED=$(sed -n 's/.*<!-- *version: *\([^ >]*\) *-->.*/\1/p' RELEASE_NOTES.md | head -n1)
            if [[ -z "$DECLARED" || "$DECLARED" == "$VERSION" ]]; then
              # Strip the HTML comment blocks (version marker + maintainer notes)
              # and any leading blank lines, so only the notes are published.
              awk '/<!--/ { in_comment = 1 }
                   in_comment && /-->/ { in_comment = 0; next }
                   !in_comment' RELEASE_NOTES.md \
                | sed -e '/./,$!d' > .github/ai/changelog.md
              echo "Using hand-written notes from RELEASE_NOTES.md (${DECLARED:-unversioned})"
              exit 0
            fi
            echo "::warning::RELEASE_NOTES.md targets v$DECLARED but this release is v$VERSION - ignoring it and generating notes instead"
          fi

          # 2. No usable hand-written notes, so ask Gemini.
          COMMITS=$(cat .github/ai/commits.txt)
          FILES=$(cat .github/ai/files.txt)

          cat > .github/ai/prompt.txt <<'PROMPT'
          You are writing the changelog for "Hikaru", an anime app.

          Write it for regular users, not developers. Friendly, clear, upbeat.
          Do NOT mention code, commits, diffs, repositories or file names.
          Do NOT invent features that are not supported by the list below.

          Reply with exactly these three Markdown sections and nothing else:

          ### What's New
          - ...

          ### Improvements & Fixes
          - ...

          ### Under the Hood
          - ...

          Keep each bullet under 15 words. Use 0 to 3 bullets per section; skip a
          bullet rather than padding it. No headings other than the three above.

          CHANGES:
          PROMPT

          printf '%s\n' "$COMMITS" >> .github/ai/prompt.txt

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::warning::No hand-written notes for v$VERSION and GEMINI_API_KEY is not set - falling back to generic notes. Add RELEASE_NOTES.md or the GEMINI_API_KEY secret."
            exit 0
          fi

          PAYLOAD=$(jq -n --rawfile prompt .github/ai/prompt.txt \
            '{contents: [{parts: [{text: $prompt}]}], generationConfig: {temperature: 0.6, maxOutputTokens: 1024}}')

          # Google retires model names for new API keys, so try newest first and
          # keep going if one of them is unavailable.
          MODELS="${GEMINI_MODELS:-gemini-3.8-flash gemini-flash-latest gemini-flash-lite-latest gemini-2.5-flash}"
          summary=""
          for model in $MODELS; do
            echo "Trying model: $model"
            attempt=0
            sleep_s=10
            while [[ $attempt -lt 3 ]]; do
              http=$(curl -sS -o /tmp/gemini.json -w '%{http_code}' -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}" \
                -H 'Content-Type: application/json' -d "$PAYLOAD")
              response=$(cat /tmp/gemini.json)
              summary=$(echo "$response" | jq -r '.candidates[0].content.parts[0].text // empty')

              if [[ -n "$summary" ]]; then
                echo "Notes generated with $model"
                echo "USED_MODEL=$model" >> "${GITHUB_ENV:-/dev/null}"
                break 2
              fi

              echo "  HTTP $http: $(echo "$response" | jq -r '.error.message // .promptFeedback.blockReason // "no text returned"' 2>/dev/null | head -c 200)"

              if echo "$response" | grep -q 'RESOURCE_EXHAUSTED\|429'; then
                echo "  Rate limited, retrying in ${sleep_s}s"
                sleep "$sleep_s"
                sleep_s=$((sleep_s * 2))
                attempt=$((attempt + 1))
              else
                break
              fi
            done
          done

          if [[ -z "$summary" ]]; then
            echo "::warning::AI changelog unavailable, using fallback text"
            exit 0
          fi

          printf '%s\n' "$summary" > .github/ai/changelog.md

          # Flatten to one line so the generated text is visible as an annotation
          # without needing the raw job log.
          PREVIEW=$(printf '%s' "$summary" | tr '\n' '~' | tr -s ' ' | head -c 700)
          echo "::notice::Gemini notes from ${model}: $PREVIEW"

      - name: Compose release notes
        run: |
          set -euo pipefail

          FALLBACK=$(cat <<'EOF'
          ### What's New
          - Fresh update with the latest improvements

          ### Improvements & Fixes
          - General stability and performance polish

          ### Under the Hood
          - Internal housekeeping for a smoother experience
          EOF
          )

          if [[ -s .github/ai/changelog.md ]]; then
            CHANGELOG=$(cat .github/ai/changelog.md)
          else
            CHANGELOG="$FALLBACK"
          fi

          awk_row() {
            printf '| %s | `Hikaru-v%s-%s-release.apk` |\n' "$1" "$VERSION" "$2"
          }

          {
            echo "## Hikaru v${VERSION}"
            echo
            echo "Hey everyone! We've got a fresh update for you 🚀"
            echo
            echo "$CHANGELOG"
            echo
            echo "---"
            echo
            echo "**📥 Download:** choose the file for your device. Most modern phones need **arm64-v8a**."
            echo
            echo "| Device | File |"
            echo "| --- | --- |"
            awk_row "Most phones (64-bit ARM)" "arm64-v8a"
            awk_row "Older phones (32-bit ARM)" "armeabi-v7a"
            awk_row "x86 emulators / devices" "x86"
            awk_row "x86_64 emulators / devices" "x86_64"
            awk_row "Not sure? Works everywhere" "universal"
            echo
            echo "**Install:** open the \`.apk\` on your device and allow installation from unknown sources if prompted."
            echo
            echo "_Version ${VERSION} · versionCode ${VERSION_CODE}_"
          } > .github/ai/release_body.md

          echo "Release notes composed:"
          cat .github/ai/release_body.md

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Hikaru v${{ env.VERSION }}
          body_path: .github/ai/release_body.md
          files: app/build/outputs/apk/release/Hikaru-v${{ env.VERSION }}-*-release.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Bump version for the next release
        if: ${{ !inputs.dry_run && (github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')) }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bump whatever is on main, so a tag-triggered release cannot rewind it.
          git fetch origin main
          git checkout -B release-version-bump origin/main

          OUT=$(./scripts/bump_version.sh)
          echo "$OUT"
          NEW_VN=$(printf '%s\n' "$OUT" | sed -n 's/^NEW_VN=//p' | tail -n1)
          NEW_VC=$(printf '%s\n' "$OUT" | sed -n 's/^NEW_VC=//p' | tail -n1)
          : "${NEW_VN:?could not determine next version}"

          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "::warning::Version file already at $NEW_VN, nothing to commit"
            exit 0
          fi

          # [skip ci] is belt and braces: this workflow no longer runs on push to main.
          git commit -m "chore(release): prepare v${NEW_VN} (versionCode ${NEW_VC}) [skip ci]"
          git push origin HEAD:main
          echo "Next release will be v$NEW_VN (versionCode $NEW_VC)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Hikaru v${VERSION:-?} release"
            echo
            echo "- Trigger: \`${GITHUB_REF}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
            echo "- APK naming: \`Hikaru-v${VERSION:-?}-{abi}-release.apk\`"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION:-?}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Final step: notify the Discord "update" channel through a webhook.
      # The URL is a credential, so it lives in an Actions secret
      # (DISCORD_UPDATE_WEBHOOK, falling back to DISCORD_WEBHOOK_URL), never in
      # this file. This is the only Discord notification the release sends.
      - name: Send update notification to Discord
        if: ${{ !inputs.dry_run || inputs.notify_test }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATE_WEBHOOK || secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_TEST: ${{ inputs.notify_test }}
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not set, skipping the update notification"
            exit 0
          fi

          if [[ "${NOTIFY_TEST:-false}" == "true" ]]; then
            # Nothing is published during a test, so link the releases page instead
            # of a tag that does not exist yet.
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases"
          else
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          fi

          # Discord caps an embed description at 4096 characters.
          BODY=$(cat .github/ai/release_body.md)
          if [[ ${#BODY} -gt 4090 ]]; then
            BODY="${BODY:0:4090}"
          fi

          PAYLOAD=$(jq -n \
            --arg title "⚙️ New Update is Available" \
            --arg desc "$BODY" \
            --arg url "$RELEASE_URL" \
            '{
              content: null,
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: 76285,
                footer: { text: " ⚙️ New Update is Available" }
              }],
              attachments: []
            }')

          # Fail on 4xx/5xx so a broken webhook is visible in the run.
          curl -sS --fail --retry 3 --retry-delay 5 \
            -X POST "$DISCORD_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
          echo "Update notification sent for v${VERSION}"
