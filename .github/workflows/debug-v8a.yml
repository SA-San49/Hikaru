name: Hikaru v8a R8 Debug

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-v8a:
    name: Build arm64-v8a R8 Hikaru-signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          # Persist Gradle cache across builds

      - name: Get current version
        id: get_version
        run: |
          CURRENT_VN=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$CURRENT_VN"
          echo "VERSION=$CURRENT_VN" >> "$GITHUB_ENV"
          echo "Building Hikaru v$CURRENT_VN"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/hikaru.jks
          test -s app/hikaru.jks

      - name: Build arm64-v8a maximum R8 Hikaru-signed APK
        run: |
          set +e
          ./gradlew assembleR8Debug -PabiList=arm64-v8a -Pandroid.enableR8.fullMode=true -Pinclude-telemetry=false -Penable-updater=false --no-daemon --stacktrace 2>&1 | tee r8-debug-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -ne 0 ]; then
            {
              grep -E '^e: ' r8-debug-build.log | tail -n 15 || true
              grep -E '^> Task .* FAILED|^Execution failed for task|^FAILURE:|^Caused by:' r8-debug-build.log | tail -n 15 || true
              tail -n 10 r8-debug-build.log
            } | awk '!seen[$0]++' | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$BUILD_STATUS"
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          DISCORD_RPC_APP_ID: ${{ vars.DISCORD_RPC_APP_ID }}

      - name: Rename and validate APK
        run: |
          VERSION="${{ env.VERSION }}"
          mkdir -p dist
          APK="dist/Hikaru-v${VERSION}-v8a-r8-debug.apk"
          mapfile -t APKS < <(find app/build/outputs/apk/r8Debug -type f -name "*.apk" | sort)
          test "${#APKS[@]}" -gt 0
          printf 'Generated APKs:\n'
          for candidate in "${APKS[@]}"; do
            printf '  %s (%s bytes)\n' "$candidate" "$(stat -c%s "$candidate")"
          done
          SOURCE_APK=$(find app/build/outputs/apk/r8Debug -type f -name "*arm64-v8a*.apk" | head -1)
          test -n "$SOURCE_APK"
          cp "$SOURCE_APK" "$APK"
          test -s "$APK"
          SIZE_BYTES=$(stat -c%s "$APK")
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "APK size: ${SIZE_MB} MiB (${SIZE_BYTES} bytes)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hikaru-v${{ env.VERSION }}-v8a-r8-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
