name: Hikaru v8a R8 Debug

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build type to assemble'
        required: true
        default: 'r8Debug'
        type: choice
        options:
          # Normal Hikaru: installs over an existing Hikaru install.
          - r8Debug
          # Same app, distinct applicationId: installs BESIDE Hikaru.
          - sideBySide

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant || 'r8Debug' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-v8a:
    name: Build arm64-v8a R8 Hikaru-signed APK
    runs-on: ubuntu-latest

    env:
      # workflow_dispatch always supplies an input here; the fallback keeps
      # `gh workflow run debug-v8a.yml` without -f behaving exactly as before.
      VARIANT: ${{ inputs.variant || 'r8Debug' }}
      # The Gradle output directory is named after the build type.
      APK_DIR: ${{ (inputs.variant || 'r8Debug') == 'sideBySide' && 'sideBySide' || 'r8Debug' }}
      # Human-readable tag, so the two flavours never share an artifact name.
      VARIANT_TAG: ${{ (inputs.variant || 'r8Debug') == 'sideBySide' && 'sideby' || 'r8-debug' }}

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          # Persist Gradle cache across builds

      - name: Get current version
        id: get_version
        run: |
          CURRENT_VN=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$CURRENT_VN"
          echo "VERSION=$CURRENT_VN" >> "$GITHUB_ENV"
          echo "Building Hikaru v$CURRENT_VN ($VARIANT)"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/hikaru.jks
          test -s app/hikaru.jks

      - name: Build arm64-v8a maximum R8 Hikaru-signed APK
        run: |
          set +e
          ./gradlew "assemble${VARIANT^}" -PabiList=arm64-v8a -Pandroid.enableR8.fullMode=true -Pinclude-telemetry=false -Penable-updater=false --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -ne 0 ]; then
            {
              grep -E '^e: ' build.log | tail -n 15 || true
              grep -E '^> Task .* FAILED|^Execution failed for task|^FAILURE:|^Caused by:' build.log | tail -n 15 || true
              tail -n 10 build.log
            } | awk '!seen[$0]++' | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$BUILD_STATUS"
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          DISCORD_RPC_APP_ID: ${{ vars.DISCORD_RPC_APP_ID }}

      - name: Rename and validate APK
        run: |
          VERSION="${{ env.VERSION }}"
          mkdir -p dist
          APK="dist/Hikaru-v${VERSION}-v8a-${VARIANT_TAG}.apk"
          mapfile -t APKS < <(find "app/build/outputs/apk/${APK_DIR}" -type f -name "*.apk" | sort)
          test "${#APKS[@]}" -gt 0
          printf 'Generated APKs:\n'
          for candidate in "${APKS[@]}"; do
            printf '  %s (%s bytes)\n' "$candidate" "$(stat -c%s "$candidate")"
          done
          SOURCE_APK=$(find "app/build/outputs/apk/${APK_DIR}" -type f -name "*arm64-v8a*.apk" | head -1)
          test -n "$SOURCE_APK"
          cp "$SOURCE_APK" "$APK"
          test -s "$APK"
          SIZE_BYTES=$(stat -c%s "$APK")
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "APK size: ${SIZE_MB} MiB (${SIZE_BYTES} bytes)"

          # Prove which package this APK will install as: this is the whole point
          # of the side-by-side variant, and a silent regression here would make
          # the APK overwrite the normal install instead of sitting beside it.
          if command -v aapt2 >/dev/null 2>&1; then
            AAPT=aapt2
          else
            AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          fi
          if [ -n "$AAPT" ]; then
            PACKAGE=$("$AAPT" dump packagename "$APK" | head -1)
            echo "APK package: $PACKAGE"
            echo "### ${VARIANT}: \`$PACKAGE\`" >> "$GITHUB_STEP_SUMMARY"
            if [ "$VARIANT" = "sideBySide" ]; then
              case "$PACKAGE" in
                *.sideby) echo "Side-by-side package confirmed: $PACKAGE" ;;
                *) echo "::error::sideBySide APK has package '$PACKAGE', expected a *.sideby suffix"; exit 1 ;;
              esac
              if [ "$PACKAGE" = "app.hikaru" ]; then
                echo "::error::sideBySide APK would replace the normal Hikaru install"
                exit 1
              fi
            fi
          else
            echo "::warning::aapt2 not found; package name was not verified"
          fi

      # The installed build is minified, and WebRTC resolves its JNI entry points
      # by name at runtime. If R8 renames a class that carries @CalledByNative
      # methods, the failure is a native SIGSEGV with no Java stack -- which is
      # exactly the crash this branch exists to fix. A green build proves nothing
      # about that, so assert the names directly.
      #
      # A dex file's string table stores type descriptors verbatim, so if a class
      # survived R8 unrenamed its descriptor appears as literal text. This is
      # cheaper and far less brittle than parsing dexdump output.
      - name: Verify WebRTC JNI symbols survived minification
        run: |
          set -euo pipefail
          APK=$(find dist -name '*.apk' | head -1)
          test -n "$APK"
          rm -rf /tmp/dex && mkdir -p /tmp/dex
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/dex
          test -n "$(ls -A /tmp/dex)"
          echo "Extracted: $(ls /tmp/dex | tr '\n' ' ')"

          # Self-check: if the extractor itself is broken every lookup would appear
          # to fail, and a false alarm here would block every future build. This
          # descriptor exists in every Android APK ever produced.
          if ! grep -aqF 'Landroid/app/Activity;' /tmp/dex/*.dex; then
            echo "::error::dex string check is not working; cannot verify JNI keep rules"
            exit 1
          fi

          FAILED=0
          for required in \
            'Lorg/webrtc/PeerConnection;' \
            'Lorg/webrtc/PeerConnectionFactory;' \
            'Lorg/webrtc/PeerConnection$Observer;' \
            'Lorg/webrtc/SdpObserver;' \
            'Lorg/webrtc/IceCandidate;' \
            'Lorg/webrtc/SessionDescription;' \
            'Lorg/webrtc/DataChannel;' \
            'Lorg/webrtc/JniCommon;' \
            'Lorg/webrtc/NativeLibrary;' \
            'Lorg/webrtc/audio/JavaAudioDeviceModule;' \
          ; do
            if grep -aqF "$required" /tmp/dex/*.dex; then
              echo "  kept: $required"
            else
              echo "::error::JNI class missing or renamed by R8: $required"
              FAILED=1
            fi
          done

          # grep exits non-zero when nothing matches, which under `set -e` would
          # abort before printing the failure summary above.
          TOTAL=$(grep -aoF 'Lorg/webrtc/' /tmp/dex/*.dex | wc -l || true)
          echo "org.webrtc descriptors present: $TOTAL"

          if [ "$FAILED" -ne 0 ]; then
            echo "R8 stripped JNI-visible WebRTC classes. The app would crash on first pairing."
            exit 1
          fi
          echo "All required WebRTC JNI classes are present under their original names."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hikaru-v${{ env.VERSION }}-v8a-${{ env.VARIANT_TAG }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
