name: Hikaru Unit Test Diagnostic

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-unit-tests:
    name: Run app unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run app unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/unit-test.log"

      - name: Surface unit-test failure details
        if: failure()
        run: |
          log="$RUNNER_TEMP/unit-test.log"
          if [[ -f "$log" ]]; then
            { grep -Ein 'FAILURE:|What went wrong:|e: file:|error:|failed|Exception|Caused by:' "$log" || true; } | tail -n 20 | while IFS= read -r line; do
              printf '::error title=Unit test diagnostic::%s\n' "$line"
            done
            tail -n 20 "$log" | while IFS= read -r line; do
              printf '::error title=Unit test log tail::%s\n' "$line"
            done
          fi
