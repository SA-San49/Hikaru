name: Hikaru ReleaseTest Build

on:
  workflow_dispatch:
  push:
    branches: [main, fix/discord-restore-rebrand]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-test:
    # Use signing secrets only for same-repository PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build releaseTest APK (signed with hikaru.jks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Configure the GitHub secret KEYSTORE_BASE64}"
          : "${SIGNING_STORE_PASSWORD:?Configure the GitHub secret SIGNING_STORE_PASSWORD}"
          : "${SIGNING_KEY_ALIAS:?Configure the GitHub secret SIGNING_KEY_ALIAS}"
          : "${SIGNING_KEY_PASSWORD:?Configure the GitHub secret SIGNING_KEY_PASSWORD}"
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/hikaru.jks
          test -s app/hikaru.jks
          keytool -list -keystore app/hikaru.jks \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" >/dev/null

      - name: Build releaseTest APK
        run: ./gradlew :app:assembleReleaseTest -Pinclude-telemetry=false -Penable-updater=false --no-daemon
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          DISCORD_RPC_APP_ID: ${{ vars.DISCORD_RPC_APP_ID }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hikaru-releaseTest
          path: app/build/outputs/apk/releaseTest/**/*.apk
          if-no-files-found: error
